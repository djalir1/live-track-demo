<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>Offline — Live Track</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
         background: #0b0f1a; color: #e6e9f2; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 20px; margin: 16px 0 4px; }
  p { margin: 0 0 20px; color: #9aa3b8; max-width: 320px; }
  button { font: inherit; font-weight: 600; color: #fff; border: 0; border-radius: 999px; padding: 10px 22px;
           background: linear-gradient(135deg, #3b6ef0, #7c4ddf); }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Live Track needs a connection to show live positions. It will reconnect as soon as you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
  <script>addEventListener("online", () => location.reload());</script>
</body>
</html>
